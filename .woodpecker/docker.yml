when:
  - branch: main
    event: push
    path:
      - "src/**"
      - "prisma/**"
      - ".woodpecker/**"
      - "Dockerfile"
  - event: [tag, manual]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  main:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      platforms: linux/amd64,linux/arm64
      repo: codeberg.org/${CI_REPO_OWNER}/koosbot
      registry: codeberg.org
      username: ${CI_REPO_OWNER}
      password:
        from_secret: cb_token
      tag:
        - main
      cache_images:
        - ujol/koosbot:main-cache
    when:
      branch: main
      event: push
      path:
        - "src/**"
        - "prisma/**"
        - ".woodpecker/**"
        - "Dockerfile"

  publish:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      platforms: linux/amd64,linux/arm64
      repo: codeberg.org/${CI_REPO_OWNER}/koosbot
      registry: codeberg.org
      username: ${CI_REPO_OWNER}
      password:
        from_secret: cb_token
      auto_tag: true
      cache_images:
        - ujol/koosbot:cache
    when:
      event: tag
